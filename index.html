<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SantehLux — заказ сантехматериалов</title>
<style>
:root{--blue:#1b6ec2;--dark:#173a5e;--bg:#f4f7fa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222}
header{background:linear-gradient(135deg,var(--dark),var(--blue));color:#fff;padding:14px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrow{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:19px;font-weight:bold;white-space:nowrap}
.search{flex:1;min-width:170px}
.search input{width:100%;padding:9px 12px;border:none;border-radius:8px;font-size:15px}
.cartbtn{background:#fff;color:var(--dark);border:none;border-radius:8px;padding:9px 14px;font-size:15px;font-weight:bold;cursor:pointer;white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:16px}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cat{padding:7px 13px;border-radius:18px;background:#fff;border:1px solid #d7e2ec;cursor:pointer;font-size:13px}
.cat.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
.ph{height:92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eaf3fb,#f7fbfe);border-radius:10px;margin-bottom:10px}
.ph svg{width:54px;height:54px;color:var(--blue)}
.brand{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#5b7a97;font-weight:bold;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:bold;font-size:13.5px;line-height:1.35;margin-bottom:8px;flex:1}
.price{font-weight:bold;color:var(--dark);font-size:14px;margin-bottom:8px}
.card button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px;cursor:pointer;font-size:14px}
.more{display:block;margin:18px auto;padding:10px 26px;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.overlay.show{display:block}
.panel{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:#fff;z-index:30;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.panel.show{transform:none}
.phead{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.phead b{font-size:18px}
.close{background:none;border:none;font-size:22px;cursor:pointer}
.pbody{flex:1;overflow-y:auto;padding:12px 16px}
.citem{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.citem .n{flex:1}
.citem .nm{font-weight:bold;font-size:13px;line-height:1.3}
.citem .pp{font-size:12px;color:#666}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid #ccd;cursor:pointer;background:#fff;font-size:15px}
.pfoot{padding:14px 16px;border-top:1px solid #eee}
.orderform input{width:100%;padding:10px;margin-bottom:8px;border:1px solid #d5dfe8;border-radius:8px;font-size:14px}
small.hint{color:#888;display:block;margin-bottom:8px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.btn-wa{background:#25d366;color:#fff}
.btn-tg{background:#2aabee;color:#fff}
.btn-copy{background:var(--dark);color:#fff}
.counter{color:#5b7a97;font-size:13px;margin-bottom:10px}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">🔧 SantehLux</div>
    <div class="search"><input id="q" placeholder="Поиск: кран, труба, радиатор..." oninput="onSearch()"></div>
    <button class="cartbtn" onclick="openCart()">🛒 Корзина <span id="cartCount">0</span></button>
  </div>
</header>
<main>
  <div class="cats" id="cats"></div>
  <div class="counter" id="counter"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;color:#888;text-align:center;padding:40px">Ничего не найдено. Попробуйте другой запрос.</div>
  <button class="more" id="moreBtn" onclick="showMore()" style="display:none">Показать ещё</button>
</main>

<div class="overlay" id="ov" onclick="closeCart()"></div>
<div class="panel" id="panel">
  <div class="phead"><b>🛒 Корзина</b><button class="close" onclick="closeCart()">✕</button></div>
  <div class="pbody" id="cbody"></div>
  <div class="pfoot">
    <div class="orderform">
      <input id="fName" placeholder="Ваше имя">
      <input id="fPhone" placeholder="Телефон для связи">
      <input id="fAddr" placeholder="Адрес / способ получения">
      <small class="hint">Цены уточняет менеджер при подтверждении заказа. Оплата после согласования.</small>
    </div>
    <button class="btn btn-wa" onclick="sendOrder('wa')">Отправить заказ в WhatsApp</button>
    <button class="btn btn-tg" onclick="sendOrder('tg')">Отправить в Telegram</button>
    <button class="btn btn-copy" onclick="sendOrder('copy')">Скопировать текст заказа</button>
  </div>
</div>

<script>
// === НАСТРОЙКИ ===
// Впишите свой номер в формате 7XXXXXXXXXXX и/или ник Telegram — заработает кнопка отправки.
const PHONE = { whatsapp: "79118974410", telegram: "" };
const PAGE_SIZE = 100;
</script>
<script src="products.js"></script>
<script>
const ICONS={"radiator": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"12\" width=\"30\" height=\"22\" rx=\"3\"/><path d=\"M15 17v12M21 17v12M27 17v12M33 17v12M14 34v5M34 34v5\"/></svg>", "convector": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"18\" width=\"32\" height=\"13\" rx=\"3\"/><path d=\"M12 23h24M12 27h24\"/><path d=\"M20 14h8M24 14v4\"/></svg>", "pipe": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"18\" width=\"26\" height=\"12\" rx=\"2\"/><circle cx=\"40\" cy=\"24\" r=\"4\"/></svg>", "tee": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 12v24\"/><path d=\"M10 24h28\"/></svg>", "elbow": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 40V20a8 8 0 0 1 8-8h16\"/></svg>", "reducer": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"16\" cy=\"24\" r=\"8\"/><circle cx=\"33\" cy=\"24\" r=\"5\"/><path d=\"M24 21h4M24 27h4\"/></svg>", "cross": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 10v28M10 24h28\"/></svg>", "plug": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 24a10 10 0 0 1 20 0\"/><path d=\"M19 24v9a5 5 0 0 0 10 0v-9\"/></svg>", "coupling": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"19\" width=\"10\" height=\"10\" rx=\"2\"/><rect x=\"28\" y=\"19\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M20 24h8\"/></svg>", "nipple": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"14\" y=\"21\" width=\"20\" height=\"6\" rx=\"2\"/><path d=\"M19 21v6M24 21v6M29 21v6\"/></svg>", "ballvalve": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"29\" r=\"8\"/><path d=\"M24 21v-8\"/><path d=\"M17 9h14\"/><path d=\"M19 29h10\"/></svg>", "valve": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 23h20v9H14z\"/><path d=\"M24 23v-9\"/><path d=\"M17 13h14\"/></svg>", "filter": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 17h24v5l-9 7v10h-6V29l-9-7z\"/></svg>", "meter": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"17\" width=\"28\" height=\"15\" rx=\"3\"/><path d=\"M16 24h4M23 24h4M30 24h4\"/></svg>", "collector": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7\" y=\"15\" width=\"34\" height=\"8\" rx=\"2\"/><path d=\"M13 23v11M21 23v11M29 23v11M37 23v11\"/></svg>", "pump": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"24\" r=\"11\"/><circle cx=\"24\" cy=\"24\" r=\"3.5\"/><path d=\"M24 13v7M24 28v7M13 24h7M28 24h7\"/></svg>", "tank": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 17c0-5 20-5 20 0v15c0 5-20 5-20 0z\"/><path d=\"M14 24h20\"/><path d=\"M18 34v6M30 34v6\"/></svg>", "boiler": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"11\" y=\"10\" width=\"26\" height=\"28\" rx=\"4\"/><path d=\"M17 17h14\"/><path d=\"M24 30c-3 2-3 5 0 6.5 3-1.5 3-4.5 0-6.5z\"/></svg>", "heater": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"15\" y=\"9\" width=\"18\" height=\"30\" rx=\"9\"/><path d=\"M24 19c-3 2.4-3 6 0 7.8 3-1.8 3-5.4 0-7.8z\"/><path d=\"M19 32h10\"/></svg>", "chimney": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"24\" r=\"12\"/><circle cx=\"24\" cy=\"24\" r=\"6\"/></svg>", "thermostat": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"27\" r=\"10\"/><path d=\"M24 27l6.5-6.5\"/><path d=\"M24 17v-5\"/><path d=\"M15 11h18\"/></svg>", "sensor": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 42V17\"/><circle cx=\"24\" cy=\"13\" r=\"3.5\"/><path d=\"M31 7c4 3 4 8 0 11M17 7c-4 3-4 8 0 11\"/></svg>", "controller": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"13\" width=\"30\" height=\"22\" rx=\"3\"/><path d=\"M15 20h11\"/><circle cx=\"31\" cy=\"19\" r=\"2\"/><circle cx=\"31\" cy=\"28\" r=\"2\"/><path d=\"M15 28h5\"/></svg>", "underfloor": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 15h32M8 22h32M8 29h32M8 36h32\"/></svg>", "sealant": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14h10v20a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2z\"/><path d=\"M24 14V8h6\"/></svg>", "hose": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 25c5-6 9 6 14 0s9-6 14 0\"/><rect x=\"4\" y=\"21\" width=\"8\" height=\"8\" rx=\"1.5\"/><rect x=\"36\" y=\"21\" width=\"8\" height=\"8\" rx=\"1.5\"/></svg>", "tray": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"13\" width=\"28\" height=\"22\" rx=\"4\"/><circle cx=\"24\" cy=\"27\" r=\"4\"/><path d=\"M14 19h20\"/></svg>", "tool": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M28 12a6 6 0 0 1 8 8l-4 4 4 4-6 6-4-4-4 4a6 6 0 0 1-8-8l4-4z\"/></svg>", "bracket": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 10v9a8 8 0 0 0 16 0v-9\"/><path d=\"M24 27v11\"/></svg>", "part": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19h6v10h-6z\"/><path d=\"M30 19h6v10h-6z\"/><path d=\"M18 21h12v6H18z\"/></svg>"};
const CATICON={"Котельное оборудование": "boiler", "Арматура для котлов": "valve", "Трубы и фитинги": "pipe", "Арматура трубопроводная": "ballvalve", "Арматура терморегулирующая": "valve", "Теплый пол и кабели": "underfloor", "Счетчики и фильтры воды": "meter", "Защита от протечек": "controller", "Насосное оборудование": "pump", "Уплотнители и герметики": "sealant", "Расширительные баки": "tank", "Стабилизаторы и автоматика": "controller", "STOUT": "part"};
const ICON_RULES=[["клапан", "valve"], ["вентиль", "valve"], ["редуктор", "valve"], ["затвор", "valve"], ["воздухоотвод", "valve"], ["смесительн", "valve"], ["обратн", "valve"], ["предохран", "valve"], ["кран", "ballvalve"], ["радиатор", "radiator"], ["полотенцесушитель", "radiator"], ["конвектор", "convector"], ["коллектор", "collector"], ["гребенк", "collector"], ["гидрострелк", "tank"], ["насос", "pump"], ["дымоход", "chimney"], ["дымоудал", "chimney"], ["коакс", "chimney"], ["оголовок", "chimney"], ["водонагреватель", "heater"], ["бойлер", "heater"], ["котел", "boiler"], ["котёл", "boiler"], ["котло", "boiler"], ["горелк", "boiler"], ["бак", "tank"], ["бачок", "tank"], ["теплый пол", "underfloor"], ["тёплый пол", "underfloor"], ["нагревательн", "underfloor"], ["кабель", "underfloor"], ["теплоносит", "sealant"], ["герметик", "sealant"], ["анаэроб", "sealant"], ["паста", "sealant"], ["фум", "sealant"], ["лен", "sealant"], ["смазк", "sealant"], ["подводк", "hose"], ["шланг", "hose"], ["гофр", "hose"], ["счетчик", "meter"], ["счётчик", "meter"], ["манометр", "meter"], ["термометр", "meter"], ["термостат", "thermostat"], ["терморегул", "thermostat"], ["датчик", "sensor"], ["зонд", "sensor"], ["zont", "controller"], ["контроллер", "controller"], ["автоматик", "controller"], ["стабилизатор", "controller"], ["реле", "controller"], ["сервопривод", "controller"], ["фильтр", "filter"], ["труба", "pipe"], ["трубк", "pipe"], ["трубы", "pipe"], ["канализац", "pipe"], ["штанг", "pipe"], ["лоток", "tray"], ["трап", "tray"], ["сифон", "tray"], ["инструмент", "tool"], ["клещи", "tool"], ["насадк", "tool"], ["ключ", "tool"], ["тройник", "tee"], ["крестовин", "cross"], ["угольник", "elbow"], ["уголок", "elbow"], ["отвод", "elbow"], ["колен", "elbow"], ["обвод", "elbow"], ["заглушк", "plug"], ["пробк", "plug"], ["муфт", "coupling"], ["американк", "coupling"], ["разъем", "coupling"], ["соединит", "coupling"], ["соединен", "coupling"], ["адаптер", "reducer"], ["переход", "reducer"], ["редукц", "reducer"], ["вставк", "reducer"], ["ниппель", "nipple"], ["футорк", "nipple"], ["сгон", "nipple"], ["штуцер", "nipple"], ["косичк", "nipple"], ["гайк", "nipple"], ["шпильк", "nipple"], ["прокладк", "part"], ["хомут", "bracket"], ["крепл", "bracket"], ["кронштейн", "bracket"], ["скоб", "bracket"], ["профиль", "bracket"], ["фланец", "part"], ["узел", "part"], ["комплект", "part"], ["принадлежност", "part"], ["компенсатор", "part"], ["седелк", "part"], ["инсталляц", "part"]];


let cart = {};
try{ cart = JSON.parse(localStorage.getItem('plumbing_cart')||'{}'); }catch(e){ cart={}; }
let cat = 'Все';
let shown = PAGE_SIZE;

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let PHOTOS = window.PHOTOS || {};
let photosLoaded = !!window.PHOTOS;
let photosPending = false;
function ensurePhotos(cb){
  if(photosLoaded){ cb && cb(); return; }
  photosLoaded = true;
  const s = document.createElement('script');
  s.src = 'photos.js';
  s.onload = () => { PHOTOS = window.PHOTOS || {}; cb && cb(); };
  s.onerror = () => { cb && cb(); };
  document.head.appendChild(s);
}
function phHTML(p){
  if(p.p && PHOTOS[p.p]) return '<img src="'+PHOTOS[p.p]+'" alt="" loading="lazy">';
  return ICONS[iconFor(p)];
}
function iconFor(p){
  const t = (p.n+' '+p.c+' '+(p.b||'')).toLowerCase();
  for(const [k,ic] of ICON_RULES) if(t.indexOf(k) >= 0) return ic;
  return CATICON[p.c] || 'part';
}

function buildCats(){
  const set = [...new Set(PRODUCTS.map(p=>p.c))].sort((a,b)=>a.localeCompare(b,'ru'));
  document.getElementById('cats').innerHTML = ['Все',...set].map(c=>
    `<button class="cat${c===cat?' active':''}" onclick="pickCat('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('');
}
function pickCat(c){ cat=c; shown=PAGE_SIZE; buildCats(); render(); window.scrollTo(0,0); }

function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  return PRODUCTS.filter(p =>
    (cat==='Все'||p.c===cat) &&
    (!q || (p.n+' '+p.s+' '+p.c+' '+p.b+' '+p.a).toLowerCase().includes(q)));
}

function onSearch(){ shown = PAGE_SIZE; render(); }
function showMore(){ shown += PAGE_SIZE; render(); }

function render(){
  const list = filtered();
  document.getElementById('counter').textContent = `Найдено позиций: ${list.length.toLocaleString('ru-RU')}`;
  document.getElementById('empty').style.display = list.length?'none':'block';
  document.getElementById('moreBtn').style.display = list.length>shown?'block':'none';
  document.getElementById('grid').innerHTML = list.slice(0,shown).map(p=>{
    const nm = p.n + (p.s ? ' ' + p.s : '');
    return `
    <div class="card">
      <div class="ph">${phHTML(p)}</div>
      <div class="brand">${esc(p.b||'')}</div>
      <div class="name">${esc(nm)}</div>
      <div class="price">Цена по запросу</div>
      <button onclick="add(${p.id})">В корзину</button>
    </div>`;}).join('');
}

function add(id){ cart[id] = (cart[id]||0)+1; save(); updateCount(); }
function change(id,d){
  if(!(id in cart)) return;
  cart[id]+=d; if(cart[id]<=0) delete cart[id];
  save(); renderCart(); updateCount();
}
function removeItem(id){ delete cart[id]; save(); renderCart(); updateCount(); }
function save(){ localStorage.setItem('plumbing_cart', JSON.stringify(cart)); }
function updateCount(){
  document.getElementById('cartCount').textContent = Object.values(cart).reduce((a,b)=>a+b,0);
}
function openCart(){ document.getElementById('ov').classList.add('show');
  document.getElementById('panel').classList.add('show'); renderCart(); }
function closeCart(){ document.getElementById('ov').classList.remove('show');
  document.getElementById('panel').classList.remove('show'); }

function renderCart(){
  const ids = Object.keys(cart).map(Number);
  document.getElementById('cbody').innerHTML = ids.length ? ids.map(id=>{
    const p = PRODUCTS.find(x=>x.id===id); if(!p) return '';
    return `<div class="citem">
      <div class="n"><div class="nm">${esc(p.n)}${p.s?' · '+esc(p.s):''}</div><div class="pp">арт. ${esc(p.a)}</div></div>
      <div class="qty">
        <button onclick="change(${id},-1)">−</button>
        <b>${cart[id]}</b>
        <button onclick="change(${id},1)">+</button>
        <button title="Удалить" onclick="removeItem(${id})">🗑</button>
      </div></div>`;
  }).join('') : '<div class="empty">Корзина пуста</div>';
  document.querySelector('.orderform').style.display = ids.length?'block':'none';
}

function orderText(){
  const name=document.getElementById('fName').value.trim()||'—';
  const phone=document.getElementById('fPhone').value.trim()||'—';
  const addr=document.getElementById('fAddr').value.trim()||'—';
  const lines = [`Заказ с сайта «SantehLux»`, `Имя: ${name}`, `Телефон: ${phone}`, `Получение: ${addr}`, ``, `Позиции:`];
  for(const id of Object.keys(cart).map(Number)){
    const p=PRODUCTS.find(x=>x.id===id); if(!p) continue;
    lines.push(`• ${p.n}${p.s?' '+p.s:''} [арт. ${p.a}] — ${cart[id]} шт.`);
  }
  return lines.join('\n');
}

function sendOrder(kind){
  if(!Object.keys(cart).length){ alert('Корзина пуста'); return; }
  const t = orderText();
  if(kind==='copy'){
    navigator.clipboard.writeText(t).then(()=>alert('Заказ скопирован — вставьте его в мессенджер или письмо')).catch(()=>alert('Не удалось скопировать'));
    return;
  }
  if(kind==='wa' && PHONE.whatsapp){
    window.open('https://wa.me/'+PHONE.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(t),'_blank');
  } else if(kind==='tg' && PHONE.telegram){
    window.open('https://t.me/'+PHONE.telegram.replace('@','')+'?text='+encodeURIComponent(t),'_blank');
  } else {
    alert('Укажите номер WhatsApp или ник Telegram в начале файла index.html (блок PHONE).');
  }
}

buildCats(); render(); updateCount();
if(!photosLoaded && PRODUCTS.some(p=>p.p)){ ensurePhotos(()=>render()); }
</script>
